services:
  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
    ports:
      - '3000:3000'
    volumes:
      - grafana_storage:/var/lib/grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - config/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  prometheus_storage: 
    driver: local
    driver_opts:
      type: 'none'
      device: /home/ubuntu/projects/Travel_Agent_MVP/monitor/config
      o: 'bind'

  grafana_storage: 
    driver: local
    driver_opts:
      type: 'none'
      device: /home/ubuntu/projects/Travel_Agent_MVP/monitor/data
      o: 'bind'